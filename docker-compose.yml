services:
  postgres:
    image: postgres:16
    container_name: acervolivros-db
    restart: always
    environment:
        POSTGRES_DB: acervolivros
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - acervolivros-data:/var/lib/postgresql/data

volumes:
  acervolivros-db: